# Render Blueprint. In Render: New -> Blueprint -> pick this repo.
# Secrets (sync: false) are entered in the Render dashboard, never committed here.
#
# Stage 0 (now, free): one instance running web + worker (PROCESS_ROLE=all).
# Stage 1 (paid): see the commented section below and docs/SCALING.md.

services:
  - type: web
    name: saathi
    runtime: docker
    plan: free
    region: singapore # closest Render region to India and to Atlas Mumbai
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PROCESS_ROLE
        value: all
      - key: MONGO_MAX_POOL
        value: "10"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # AI: Gemini free tier (key from aistudio.google.com). Claude stays possible with AI_PROVIDER=anthropic.
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODELS
        value: gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.8-flash
      - key: AI_MODEL_LIMITS
        value: gemini-3.5-flash-lite=13/480,gemini-3.1-flash-lite=13/480,gemini-3.8-flash=4/18
      # The app's own address, e.g. https://saathi.onrender.com (frontend and API are on the same one).
      - key: CLIENT_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      # Notifications on phones and computers (Web Push). Same key pair as in server/.env.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Email: password reset links, and the email copy of important notifications when push can't
      # reach the user (without it, those only go to the logs).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # Free plan: the SMTP ports are blocked, so emails go through an HTTPS API: Resend first, then Brevo.
      - key: RESEND_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      # "Continue with Google": the OAuth Web Client ID (public). Empty = no Google button.
      - key: GOOGLE_CLIENT_ID
        sync: false

