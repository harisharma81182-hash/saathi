<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">Saathi</title>
  <desc id="d">Saathi's glowing golden face at the centre of a small solar system: Tasks, Reminders, Study plan, Memory and Voice orbit it in deep space. Your AI friend who gets things done.</desc>
  <defs>
    <clipPath id="frame"><rect width="1280" height="400" rx="24"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070914"/>
      <stop offset="0.55" stop-color="#0E1230"/>
      <stop offset="1" stop-color="#1B1748"/>
    </linearGradient>
    <radialGradient id="nebViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C4DFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#7C4DFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F2A541" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#F2A541" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B5BDB" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3B5BDB" stop-opacity="0"/>
    </radialGradient>
    <!-- Saathi's orb: lit from inside, brightest towards the upper left -->
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5" fx="0.38" fy="0.32">
      <stop offset="0" stop-color="#FFF7E3"/>
      <stop offset="0.28" stop-color="#FFD58A"/>
      <stop offset="0.62" stop-color="#F4A23E"/>
      <stop offset="0.88" stop-color="#D9781F"/>
      <stop offset="1" stop-color="#A9541A"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFC56B" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#F2A541" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F2A541" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#FFE7B8" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#FFB45C" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFBF2"/>
      <stop offset="1" stop-color="#F6CF86"/>
    </linearGradient>
    <linearGradient id="orbitGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2A541" stop-opacity="0.05"/>
      <stop offset="0.5" stop-color="#FFD58A" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#F2A541" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.95  0 0 0 0 0.65  0 0 0 0 0.25  0 0 0 0.45 0" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- planets: light side up-left, own colour, darker edge -->
    <radialGradient id="pBlue" fx="0.35" fy="0.3"><stop offset="0" stop-color="#DDE6FF"/><stop offset="0.45" stop-color="#5B8CFF"/><stop offset="1" stop-color="#2A3F9E"/></radialGradient>
    <radialGradient id="pOrange" fx="0.35" fy="0.3"><stop offset="0" stop-color="#FFE3CC"/><stop offset="0.45" stop-color="#FF8A3D"/><stop offset="1" stop-color="#A3461A"/></radialGradient>
    <radialGradient id="pViolet" fx="0.35" fy="0.3"><stop offset="0" stop-color="#EBDDFF"/><stop offset="0.45" stop-color="#A06BFF"/><stop offset="1" stop-color="#4E2A9E"/></radialGradient>
    <radialGradient id="pTeal" fx="0.35" fy="0.3"><stop offset="0" stop-color="#D6FFF7"/><stop offset="0.45" stop-color="#2DD4BF"/><stop offset="1" stop-color="#11706A"/></radialGradient>
    <radialGradient id="pPink" fx="0.35" fy="0.3"><stop offset="0" stop-color="#FFE0EE"/><stop offset="0.45" stop-color="#FF5FA2"/><stop offset="1" stop-color="#9E2A5E"/></radialGradient>
    <style>
      .tw { animation: tw 4s ease-in-out infinite; }
      .tw2 { animation: tw 5.5s ease-in-out 1.2s infinite; }
      .tw3 { animation: tw 3.2s ease-in-out 2.1s infinite; }
      .breathe { animation: breathe 6s ease-in-out infinite; transform-origin: 980px 200px; }
      .shoot { animation: shoot 9s linear 2s infinite; opacity: 0; }
      .label { font: 600 13px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #D9D3EA; letter-spacing: 0.3px; }
      @keyframes tw { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
      @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.06); opacity: 1; } }
      @keyframes shoot { 0% { opacity: 0; transform: translate(0, 0); } 3% { opacity: 1; } 10% { opacity: 0; transform: translate(-260px, 110px); } 100% { opacity: 0; transform: translate(-260px, 110px); } }
      @media (prefers-reduced-motion: reduce) { .tw, .tw2, .tw3, .breathe, .shoot { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#sky)"/>
    <!-- nebula haze -->
    <ellipse cx="1060" cy="90" rx="380" ry="230" fill="url(#nebViolet)"/>
    <ellipse cx="980" cy="210" rx="300" ry="220" fill="url(#nebGold)"/>
    <ellipse cx="180" cy="380" rx="420" ry="220" fill="url(#nebBlue)"/>
    <ellipse cx="560" cy="-20" rx="300" ry="140" fill="url(#nebViolet)" opacity="0.6"/>

    <!-- stars: three sizes, a few twinkle -->
    <g fill="#FFF8EB">
      <circle cx="42" cy="38" r="1"/><circle cx="118" cy="92" r="0.8" opacity="0.6"/><circle cx="210" cy="30" r="1.2" class="tw"/>
      <circle cx="300" cy="120" r="0.7" opacity="0.5"/><circle cx="372" cy="54" r="1" opacity="0.8"/><circle cx="455" cy="22" r="0.8" class="tw2"/>
      <circle cx="520" cy="96" r="1.1" opacity="0.7"/><circle cx="610" cy="40" r="0.8" opacity="0.6"/><circle cx="660" cy="140" r="1.4" class="tw3"/>
      <circle cx="40" cy="250" r="0.9" opacity="0.5"/><circle cx="96" cy="340" r="1.2" class="tw"/><circle cx="250" cy="372" r="0.8" opacity="0.6"/>
      <circle cx="400" cy="350" r="1" opacity="0.7"/><circle cx="560" cy="380" r="0.7" opacity="0.5"/><circle cx="640" cy="330" r="1.2" class="tw2"/>
      <circle cx="700" cy="60" r="0.9" opacity="0.7"/><circle cx="760" cy="24" r="1.3" class="tw3"/><circle cx="1200" cy="40" r="1" opacity="0.8"/>
      <circle cx="1250" cy="150" r="1.4" class="tw"/><circle cx="1230" cy="360" r="0.9" opacity="0.6"/><circle cx="1150" cy="380" r="1.1" class="tw2"/>
      <circle cx="700" cy="250" r="0.8" opacity="0.5"/><circle cx="740" cy="370" r="1" opacity="0.6"/><circle cx="1100" cy="20" r="0.8" opacity="0.6"/>
      <circle cx="840" cy="40" r="1" opacity="0.7"/><circle cx="1270" cy="260" r="0.9" opacity="0.6"/><circle cx="20" cy="150" r="1.1" class="tw3"/>
      <circle cx="330" cy="240" r="0.6" opacity="0.4"/><circle cx="470" cy="270" r="0.7" opacity="0.4"/><circle cx="160" cy="200" r="0.6" opacity="0.4"/>
    </g>
    <!-- bright four-point star -->
    <g transform="translate(1188 300)" opacity="0.9" class="tw2">
      <path d="M0 -9 L1.6 -1.6 L9 0 L1.6 1.6 L0 9 L-1.6 1.6 L-9 0 L-1.6 -1.6 Z" fill="#FFF3DC"/>
    </g>
    <!-- a shooting star now and then -->
    <g class="shoot"><line x1="1180" y1="40" x2="1250" y2="10" stroke="#FFF3DC" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/></g>

    <!-- orbits: tilted ellipses around Saathi; the back half (behind the orb) fades -->
    <g fill="none" stroke-width="1.2" transform="rotate(-10 980 200)">
      <g stroke="#FFD58A" opacity="0.17">
        <path d="M870 200 A110 36 0 0 1 1090 200"/>
        <path d="M820 200 A160 54 0 0 1 1140 200"/>
        <path d="M768 200 A212 72 0 0 1 1192 200"/>
        <path d="M720 200 A260 90 0 0 1 1240 200"/>
      </g>
      <g stroke="url(#orbitGold)" opacity="0.9">
        <path d="M870 200 A110 36 0 0 0 1090 200"/>
        <path d="M820 200 A160 54 0 0 0 1140 200"/>
        <path d="M768 200 A212 72 0 0 0 1192 200"/>
        <path d="M720 200 A260 90 0 0 0 1240 200"/>
      </g>
    </g>

    <!-- Saathi: halo, orb, rim light, face -->
    <circle cx="980" cy="200" r="150" fill="url(#halo)" class="breathe"/>
    <circle cx="980" cy="200" r="70" fill="#F2A541" opacity="0.35" filter="url(#soft)"/>
    <circle cx="980" cy="200" r="60" fill="url(#orb)"/>
    <circle cx="980" cy="200" r="59" fill="none" stroke="url(#rim)" stroke-width="2"/>
    <ellipse cx="958" cy="172" rx="20" ry="11" fill="#FFFFFF" opacity="0.35" transform="rotate(-25 958 172)"/>
    <g>
      <ellipse cx="961" cy="196" rx="6" ry="8.5" fill="#3A2210"/>
      <ellipse cx="999" cy="196" rx="6" ry="8.5" fill="#3A2210"/>
      <circle cx="963" cy="192.5" r="2" fill="#FFFFFF" opacity="0.9"/>
      <circle cx="1001" cy="192.5" r="2" fill="#FFFFFF" opacity="0.9"/>
      <ellipse cx="947" cy="214" rx="7" ry="4" fill="#FF7A6B" opacity="0.28"/>
      <ellipse cx="1013" cy="214" rx="7" ry="4" fill="#FF7A6B" opacity="0.28"/>
      <path d="M966 216 Q980 229 994 216" fill="none" stroke="#3A2210" stroke-width="3.2" stroke-linecap="round"/>
    </g>

    <!-- planets in front of their orbits, each with its label -->
    <g transform="rotate(-10 980 200)">
      <!-- Tasks: inner orbit, front left -->
      <g transform="translate(905 225)">
        <circle r="13" fill="#5B8CFF" opacity="0.35" filter="url(#soft)"/>
        <circle r="9" fill="url(#pBlue)"/>
      </g>
      <!-- Reminders: second orbit, front right -->
      <g transform="translate(1110 231)">
        <circle r="15" fill="#FF8A3D" opacity="0.35" filter="url(#soft)"/>
        <circle r="10.5" fill="url(#pOrange)"/>
      </g>
      <!-- Study plan: third orbit, far left -->
      <g transform="translate(790 232)">
        <circle r="16" fill="#A06BFF" opacity="0.35" filter="url(#soft)"/>
        <circle r="11" fill="url(#pViolet)"/>
        <ellipse rx="18" ry="4.5" fill="none" stroke="#D9C6FF" stroke-opacity="0.55" stroke-width="1.4" transform="rotate(-8)"/>
      </g>
      <!-- Memory: third orbit, front centre -->
      <g transform="translate(1010 272)">
        <circle r="13" fill="#2DD4BF" opacity="0.35" filter="url(#soft)"/>
        <circle r="8.5" fill="url(#pTeal)"/>
      </g>
      <!-- Voice: outer orbit, right -->
      <g transform="translate(1215 236)">
        <circle r="14" fill="#FF5FA2" opacity="0.35" filter="url(#soft)"/>
        <circle r="9.5" fill="url(#pPink)"/>
      </g>
    </g>
    <!-- labels, upright (positions match the rotated planets) -->
    <text class="label" x="910" y="264" text-anchor="middle">Tasks</text>
    <text class="label" x="1113" y="236" text-anchor="middle">Reminders</text>
    <text class="label" x="798" y="293" text-anchor="middle">Study plan</text>
    <text class="label" x="1022" y="292" text-anchor="middle">Memory</text>
    <text class="label" x="1218" y="224" text-anchor="middle">Voice</text>

    <!-- words -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
      <text x="72" y="178" font-size="104" font-weight="800" letter-spacing="-3" fill="url(#word)" filter="url(#textGlow)">Saathi</text>
      <text x="76" y="232" font-size="30" font-weight="600" fill="#F2B45A">Your AI friend who gets things done</text>
      <text x="77" y="276" font-size="17" fill="#B9B3CC">Tasks, reminders, study plans and memory from one sentence,</text>
      <text x="77" y="302" font-size="17" fill="#B9B3CC">typed or spoken, in your language.</text>
      <g transform="translate(77 330)">
        <rect width="236" height="30" rx="15" fill="#F2A541" fill-opacity="0.1" stroke="#F2A541" stroke-opacity="0.45"/>
        <text x="118" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#F6CF86" letter-spacing="0.4">kal 9 baje lab file yaad dila dena</text>
      </g>
    </g>
  </g>

  <!-- very light gold border -->
  <rect x="0.5" y="0.5" width="1279" height="399" rx="23.5" fill="none" stroke="#F2A541" stroke-opacity="0.28"/>
</svg>
